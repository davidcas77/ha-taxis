name: Browser scenarios

# The scripts/*-browser.py scenarios (and scripts/browser-regression.py) drive the
# real UI in a headless Chromium against the fake Home Assistant
# (scripts/mock-ha.ts). They intercept every write, so nothing here touches a real
# Home Assistant.
#
# They are NOT part of CI on every pull request: they need a browser and take a
# few minutes. They run nightly and on demand (Actions > Browser scenarios > Run
# workflow), which is enough to catch a UI regression within a day.
#
# How this workflow provides what the scripts expect (scripts/browser_common.py):
#   - the Python `playwright` package and its own Chromium. CHROMIUM_PATH is left
#     unset, so the scripts launch the browser Playwright installed.
#   - Taxis serving the BUILT UI (dist/web) on 8099 plus the fake Home Assistant on
#     8124, with an empty data directory. Every script reads TAXIS_TEST_URL.
#   - screenshots in output/playwright (TAXIS_SCREENSHOT_DIR), uploaded afterwards.
# No script names a fixed path: they find the repo from their own location and
# write temporary files below a temporary directory, so the same command runs on a
# laptop and here.
#
# One scenario failing fails the job, after every scenario has run, and the
# failing ones are listed at the end. To run them locally, see the top of
# scripts/browser_common.py.

on:
  workflow_dispatch:
  schedule:
    # 03:23 UTC every night.
    - cron: "23 3 * * *"

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAXIS_TEST_URL: http://localhost:8099
      TAXIS_SCREENSHOT_DIR: output/playwright
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build

      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Check the scenarios compile
        run: python -m compileall -q scripts

      - name: Start the fake Home Assistant and Taxis
        run: |
          mkdir -p output/playwright "$RUNNER_TEMP/taxis-data"
          # The fake Home Assistant, on 8124 (the address scripts/mock.env names).
          npx tsx scripts/mock-ha.ts > mock-ha.log 2>&1 &
          # Taxis, serving dist/web on 8099 (its default), with its own empty database.
          TAXIS_DATA_DIR="$RUNNER_TEMP/taxis-data" node --env-file=scripts/mock.env dist/server.js > taxis.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8099/api/hierarchy | grep -q '"ok":true'; then
              echo "Taxis is up."
              exit 0
            fi
            sleep 1
          done
          echo "Taxis did not come up."
          cat mock-ha.log taxis.log
          exit 1

      - name: Run the scenarios
        run: |
          failed=""
          for script in scripts/browser-regression.py scripts/*-browser.py; do
            echo "::group::$script"
            if python "$script"; then
              echo "passed: $script"
            else
              echo "FAILED: $script"
              failed="$failed $script"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::Failed scenarios:$failed"
            exit 1
          fi

      - name: Scenario log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-scenarios
          path: |
            mock-ha.log
            taxis.log
            output/playwright
          if-no-files-found: ignore
