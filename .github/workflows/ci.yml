name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The formatting check below diffs against the base branch.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Formatting is checked only for the files a pull request changes, so the
      # repository gets formatted as it is touched, without one giant reformat.
      # Not run on a push to main: by then the pull request has been checked.
      # To fix a failure: npm run format -- <the files listed>
      - name: Check formatting of the changed files
        if: github.event_name == 'pull_request'
        run: |
          files=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" | grep -E '\.(ts|tsx|css|json|md)$' || true)
          if [ -z "$files" ]; then
            echo "No formattable files changed."
            exit 0
          fi
          echo "$files"
          echo "$files" | xargs npx prettier --check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The app image must build for every architecture Home Assistant installs it on.
  image:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: taxis/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
